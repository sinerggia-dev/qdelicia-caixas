<!doctype html>
<html lang="pt-BR" data-fluxo="saida">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demonstração — lançar retorno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- A FOLHA DO APP VEM ANTES da do demo: e dela que saem as cores da empresa, e a
     ordem importa — a folha do demo precisa poder sobrescrever o que for dela. -->
<link rel="stylesheet" href="styles.css?v=d0b9de75">
<style>
:root{
  /* ================= SEM PALETA PROPRIA =================
   *
   * O demo chegou com UM tema e UM fundo escritos a mao. Dentro do app isso queria
   * dizer: o escritorio escolhe roxo em Aparencia, e o tutorial continua verde — a
   * mesma empresa com duas caras, a um toque de distancia.
   *
   * Aqui os tokens dele viram APELIDOS dos tokens do app. A folha do demo nao muda em
   * regra nenhuma; muda so de onde vem a cor. Trocar a cor da empresa passa a trocar a
   * cor do tutorial junto, sem ninguem mexer neste arquivo.
   *
   * SAIDA E AZUL, RETORNO E VERDE. O demo trazia o contrario — saida verde, retorno
   * azul. Nao e detalhe: o painel, os graficos e o extrato pintam saida com
   * `--azul-cheio` e retorno com `--verde-cheio`, e um tutorial que ensina o codigo de
   * cor invertido ensina a ler errado a tela que vem depois dele. */
  --dl-marca:var(--brand); --dl-sobre-marca:var(--sobre-brand);
  --dl-marca-ink:var(--roxo-txt); --dl-marca-rgb:var(--brand-rgb);
  --dl-brand:var(--brand);
  --dl-saida:var(--azul-cheio); --dl-retorno:var(--verde-cheio);
  --dl-warn:var(--ambar); --dl-danger:var(--vermelho);
  --dl-radius:var(--raio-sm); --dl-radius-lg:var(--raio);
  --dl-font:var(--fonte); --dl-mono:var(--fonte-mono);
  /* As superficies do demo nao sao as do app com outro nome: o `surface-2` dele e mais
     ESCURO que o cartao (e o `--campo` daqui), e o `surface-3` e mais claro. Por isso
     cada um aponta para o degrau certo, e nao para o de nome parecido. */
  --dl-bg:var(--bg); --dl-fim:var(--campo);
  --dl-surface:var(--surface); --dl-surface-2:var(--campo); --dl-surface-3:var(--surface-2);
  --dl-line:var(--linha); --dl-line-2:var(--neutro); --dl-line-3:var(--linha-viva);
  --dl-text:var(--txt); --dl-text-soft:var(--txt2); --dl-text-muted:var(--txt3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:linear-gradient(180deg,var(--dl-bg) 0%,var(--dl-fim) 100%) fixed;color:var(--dl-text);
  font-family:var(--dl-font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:where(a,button):focus-visible{outline:2px solid var(--dl-marca-ink);outline-offset:2px}

.tela{max-width:460px;margin:0 auto;padding:14px 14px 26px}


/* ---------- escolher o fluxo ---------- */
.fluxos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fluxo{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px solid var(--dl-line-2);
  border-radius:var(--dl-radius);background:var(--dl-surface);color:var(--dl-text-soft);
  font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left}
.fluxo i{width:26px;height:26px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border-radius:8px;font-style:normal;font-size:14px}
.fluxo--s i{background:rgba(52,196,110,.16);color:var(--dl-saida)}
.fluxo--r i{background:rgba(111,168,240,.16);color:var(--dl-retorno)}
[data-fluxo="saida"] .fluxo--s{border-color:var(--dl-saida);background:rgba(52,196,110,.12);color:var(--dl-text)}
[data-fluxo="retorno"] .fluxo--r{border-color:var(--dl-retorno);background:rgba(111,168,240,.12);color:var(--dl-text)}

/* ---------- palco (o que entra no vídeo) ---------- */
.palco{position:relative}

.fone{position:relative;width:100%;max-width:372px;margin:0 auto;
  border:7px solid #0B1A2B;border-radius:30px;background:#0B1A2B;
  box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1.5px var(--dl-line-2)}
.fone__barra{display:flex;align-items:center;justify-content:space-between;
  padding:5px 16px 4px;font-family:var(--dl-mono);font-size:10.5px;color:var(--dl-text-muted);
  letter-spacing:.04em}
.fone__vp{position:relative;height:600px;overflow:hidden;border-radius:0 0 23px 23px;
  background:linear-gradient(180deg,var(--dl-bg) 0%,var(--dl-fim) 100%)}

/* ---------- o dedo ---------- */
.dedo{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;
  border-radius:50%;background:rgba(255,255,255,.20);border:2px solid rgba(255,255,255,.78);
  box-shadow:0 3px 14px rgba(0,0,0,.5);pointer-events:none;z-index:60;opacity:0;
  transform:translate(var(--x,60px),var(--y,60px)) scale(var(--s,1));
  transition:transform .36s cubic-bezier(.3,.72,.2,1),opacity .22s linear}
.dedo--on{opacity:1}
.dedo b{position:absolute;inset:-7px;border-radius:50%;border:2.5px solid var(--dl-marca-ink);
  opacity:0}
.dedo--toca b{animation:toque .42s ease-out}
@keyframes toque{0%{opacity:.95;transform:scale(.45)}100%{opacity:0;transform:scale(1.6)}}

/* ---------- a tela do app ---------- */
.ap{position:absolute;inset:0;display:flex;flex-direction:column}
/* z-index no cabeçalho: o corpo transformado cria contexto de empilhamento e,
   sem isto, o conteúdo que sobe passa POR CIMA do cabeçalho em vez de sumir
   debaixo dele — que é como rolagem se parece num app de verdade */
.ap__cab{position:relative;z-index:5;flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:11px 14px;border-bottom:1px solid var(--dl-line);background:var(--dl-surface-2)}
.ap__corpo{position:relative;z-index:1}
.ap__cab b{font-size:14.5px}
.ap__cab span{font-size:11.5px;color:var(--dl-text-muted)}
.ap__sair{margin-left:auto;flex:0 0 auto;padding:5px 11px;border:1px solid var(--dl-line-3);
  border-radius:8px;background:transparent;color:var(--dl-text-soft);font:inherit;font-size:12px;
  font-weight:600;cursor:pointer}
.ap__volta{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;background:var(--dl-surface-3);color:var(--dl-text-soft);font-size:13px}
/* o corpo sobe quando o teclado abre, como num app de verdade: sem isto o
   teclado tapa justamente a contagem e o total, que é o que precisa ser visto */
/* sem overflow:hidden aqui de propósito: quem recorta é o .fone__vp.
   Se o recorte ficasse neste elemento, o translateY levaria a caixa de
   recorte junto e o conteúdo que sobra embaixo nunca apareceria. */
.ap__corpo{flex:1 1 auto;padding:12px 13px;
  transition:transform .32s cubic-bezier(.25,.8,.3,1)}
.ap__r{margin:0 0 7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dl-text-muted)}
.ap__r+.ap__r{margin-top:12px}

.ap__acao{display:flex;width:100%;align-items:center;gap:11px;padding:13px 12px;margin-bottom:9px;
  border:1.5px solid var(--dl-line-2);border-radius:var(--dl-radius-lg);background:var(--dl-surface);
  color:var(--dl-text);font:inherit;text-align:left}
.ap__acao i{width:34px;height:34px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border-radius:10px;font-style:normal;font-size:16px}
.ap__acao--s i{background:rgba(52,196,110,.16);color:var(--dl-saida)}
.ap__acao--r i{background:rgba(111,168,240,.16);color:var(--dl-retorno)}
.ap__acao b{display:block;font-size:14.5px}
.ap__acao em{display:block;font-style:normal;font-size:11.5px;color:var(--dl-text-muted)}

.ap__mini{border:1px solid var(--dl-line);border-radius:var(--dl-radius);background:var(--dl-surface);
  overflow:hidden}
.ap__mini div{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 11px;font-size:12.5px;color:var(--dl-text-soft)}
.ap__mini div+div{border-top:1px solid var(--dl-line)}
.ap__mini .dl-n{font-family:var(--dl-mono);font-weight:600;color:var(--dl-text)}
.ap__mini .novo{background:rgba(var(--dl-marca-rgb),.14)}

/* rótulo em cima e caixa embaixo, como no app */
.ap__campo{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 11px;margin-bottom:10px;
  border:1.5px solid var(--dl-line-2);border-radius:var(--dl-radius);background:var(--dl-surface-2)}
.ap__campo--foco{border-color:var(--dl-marca-ink);box-shadow:0 0 0 3px rgba(var(--dl-marca-rgb),.20)}
.ap__lab{display:block;margin-bottom:4px;font-size:12px;color:var(--dl-text-soft)}
.ap__val{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap__val--v{color:var(--dl-text-muted);font-weight:400}
.ap__seta{flex:0 0 auto;color:var(--dl-text-muted);font-size:13px}
.ob{font-style:normal;color:var(--dl-warn)}
.ap__cartao{padding:11px 12px;margin-bottom:13px;border:1px solid var(--dl-line);
  border-radius:var(--dl-radius);background:var(--dl-surface)}
.ap__cartao b{display:block;font-size:14.5px;margin-bottom:3px}
.ap__cartao p{margin:0;font-size:11.5px;line-height:1.4;color:var(--dl-text-muted)}
.ap__req{margin:-2px 0 12px;font-size:11px;color:var(--dl-text-muted)}
/* tela de encerramento */
.ap__fim{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:18px 20px}
.ap__fim__logo{width:186px;height:auto;margin-bottom:16px}
.ap__fim h2{margin:0 0 10px;font-size:19px;line-height:1.28;font-weight:700;letter-spacing:-.01em}
.ap__fim h2 b{color:var(--dl-marca-ink)}
.ap__fim p{margin:0 0 24px;font-size:13px;line-height:1.45;color:var(--dl-text-muted);max-width:270px}
.ap__fim .ap__grv{max-width:280px}
.ap__fim__l{display:flex;gap:9px;width:100%;max-width:280px;margin-top:9px}
.ap__fim__l .ap__grv{flex:1 1 0;margin-top:0}
/* seletor com .ap__fim de propósito: a regra base .ap__grv vem depois nesta
   folha e, com a mesma especificidade, ganharia — os três botões saíam verdes */
.ap__fim .ap__grv--sec{background:transparent;color:var(--dl-text);
  border:1.5px solid var(--dl-line-3);font-weight:600}
.ap__fim .ap__grv--fan{background:transparent;color:var(--dl-text-muted);
  border:1.5px solid transparent;font-weight:600}
.ap__fim .ap__grv--bloq{color:var(--dl-text-muted);opacity:.62}
.ap__chk{list-style:none;margin:18px 0 0;padding:0;text-align:left;width:100%;max-width:280px}
.ap__chk li{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px;
  color:var(--dl-text-muted)}
.ap__chk li.ok{color:var(--dl-marca-ink)}
.ap__chk i{width:19px;height:19px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border-radius:999px;border:1.5px solid currentColor;
  font-style:normal;font-size:11px}

.ap__ref{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px;margin:-4px 0 10px;border-radius:9px;background:rgba(111,168,240,.12);
  font-size:11.5px;color:var(--dl-text-soft)}
.ap__ref b{font-family:var(--dl-mono);font-size:13px;color:var(--dl-retorno)}

.ap__cont{border:1px solid var(--dl-line);border-radius:var(--dl-radius);background:var(--dl-surface-2);
  overflow:hidden}
.ap__ln{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:6px 11px;
  font-size:13.5px}
.ap__ln+.ap__ln{border-top:1px solid var(--dl-line)}
.ap__ln .cz{color:var(--dl-text-muted);font-size:11.5px}
.ap__cx{min-width:62px;height:32px;display:inline-flex;align-items:center;justify-content:flex-end;
  padding:0 10px;border:1.5px solid var(--dl-line-2);border-radius:9px;background:var(--dl-surface-3);
  font-family:var(--dl-mono);font-size:14.5px;font-weight:600;color:var(--dl-text)}
.ap__cx--foco{border-color:var(--dl-marca-ink);box-shadow:0 0 0 3px rgba(var(--dl-marca-rgb),.20)}
.ap__cx--erro{border-color:var(--dl-danger);color:var(--dl-danger);box-shadow:0 0 0 3px rgba(255,153,153,.18)}
.ap__cx i{display:inline-block;width:1.5px;height:17px;margin-left:2px;background:var(--dl-marca-ink);
  animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}

.ap__tot{display:flex;align-items:center;justify-content:space-between;gap:9px;
  margin-top:9px;padding:9px 12px;border:1px solid var(--dl-line-2);border-radius:var(--dl-radius);
  background:var(--dl-surface);font-size:13px;color:var(--dl-text-soft)}
.ap__tot b{font-family:var(--dl-mono);font-size:19px;font-weight:700;color:var(--dl-text)}
.ap__tot--neg b{color:var(--dl-danger)}
.ap__tot--pulso{animation:pulso .7s ease-out}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(var(--dl-marca-rgb),.55)}
  100%{box-shadow:0 0 0 13px rgba(var(--dl-marca-rgb),0)}}

.ap__obs{margin-top:9px;padding:8px 11px;border:1.5px solid var(--dl-line-2);border-radius:var(--dl-radius);
  background:var(--dl-surface-2);min-height:62px}
.ap__obs--foco{border-color:var(--dl-marca-ink);box-shadow:0 0 0 3px rgba(var(--dl-marca-rgb),.20)}
.ap__obs p{margin:3px 0 0;font-size:13px;line-height:1.35;min-height:18px}
.ap__obs i{display:inline-block;width:1.5px;height:15px;vertical-align:-2px;
  background:var(--dl-marca-ink);animation:pisca 1s steps(1) infinite}

.ap__grv{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:var(--dl-radius);
  background:var(--dl-marca);color:var(--dl-sobre-marca);font:inherit;font-size:14.5px;font-weight:700}
.ap__grv[disabled]{background:var(--dl-surface-3);color:var(--dl-text-muted)}
.ap--tec .ap__grv{visibility:hidden}

.ap__alerta{margin-top:9px;padding:9px 11px;border:1px solid rgba(255,153,153,.5);
  border-radius:var(--dl-radius);background:rgba(255,153,153,.10);font-size:12.5px;
  line-height:1.4;color:var(--dl-text-soft)}
.ap__alerta b{color:var(--dl-danger)}

/* folha (select) e teclados */
.dl-folha,.tec{position:absolute;left:0;right:0;bottom:0;z-index:30;
  border-top:1px solid var(--dl-line-2);background:var(--dl-surface-2);
  box-shadow:0 -10px 26px rgba(0,0,0,.36);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.25,.8,.3,1)}
.dl-folha--on,.tec--on{transform:translateY(0)}
.dl-folha{border-radius:16px 16px 0 0;padding:9px 11px 13px}
.dl-folha__t{margin:2px 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dl-text-muted)}
.dl-folha__o{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:10px 11px;margin-bottom:6px;border:1px solid var(--dl-line);border-radius:10px;
  background:var(--dl-surface);color:var(--dl-text);font:inherit;font-size:13.5px;text-align:left}

.tec{padding:7px 6px 10px}
.tec__g{display:grid;gap:5px}
.tec--num .tec__g{grid-template-columns:repeat(3,1fr)}
.tec__k{padding:11px 0;border:1px solid var(--dl-line);border-radius:9px;background:var(--dl-surface-3);
  color:var(--dl-text);font-family:var(--dl-mono);font-size:17px;font-weight:600;text-align:center}
.tec--txt .tec__l{display:flex;gap:4px;margin-bottom:5px;justify-content:center}
.tec--txt .tec__k{flex:1 1 0;min-width:0;padding:9px 0;font-family:var(--dl-font);font-size:14px}
.tec__k--w{flex:3 1 0 !important}

.flash{animation:fl .55s ease-out}
@keyframes fl{0%{background-color:rgba(var(--dl-marca-rgb),.34)}100%{background-color:transparent}}

.toast{position:absolute;left:12px;right:12px;bottom:14px;z-index:50;
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;
  border:1px solid rgba(52,196,110,.45);background:rgba(20,58,40,.96);
  box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13px;
  transform:translateY(130%);transition:transform .34s cubic-bezier(.25,.85,.3,1)}
.toast--on{transform:translateY(0)}
.toast i{width:24px;height:24px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border-radius:50%;background:var(--dl-saida);color:#0A1F38;
  font-style:normal;font-size:13px;font-weight:700}
.toast b{display:block;font-size:13px}
.toast em{display:block;font-style:normal;font-size:11.5px;color:var(--dl-text-soft)}

/* ---------- legenda ---------- */
.leg{min-height:68px;margin:12px auto 0;max-width:372px;padding:11px 13px;
  border:1px solid var(--dl-line);border-left:3px solid var(--dl-marca-ink);
  border-radius:11px;background:var(--dl-surface);font-size:13.5px;line-height:1.42;
  color:var(--dl-text-soft)}
.leg b{color:var(--dl-text)}
.leg--erro{border-left-color:var(--dl-danger)}
.leg--erro b{color:var(--dl-danger)}

/* ---------- controles (fora do vídeo) ---------- */
.ctrl{display:flex;align-items:center;gap:8px;max-width:372px;margin:13px auto 0}
.ctrl button{padding:8px 12px;border:1px solid var(--dl-line-2);border-radius:10px;
  background:var(--dl-surface);color:var(--dl-text);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer}
.ctrl__b{flex:1 1 auto;height:6px;border-radius:999px;background:rgba(255,255,255,.09);
  overflow:hidden}
.ctrl__b i{display:block;height:100%;width:0;background:var(--dl-marca);border-radius:999px;
  transition:width .3s linear}
.vels{display:flex;gap:5px;max-width:372px;margin:9px auto 0}
.vels button{flex:1 1 0;padding:7px 0;border:1px solid var(--dl-line-2);border-radius:9px;
  background:var(--dl-surface);color:var(--dl-text-muted);font:inherit;font-family:var(--dl-mono);
  font-size:12.5px;cursor:pointer}
.vels button[aria-pressed="true"]{border-color:var(--dl-marca-ink);color:var(--dl-text);
  background:rgba(var(--dl-marca-rgb),.14)}
/* botão de áudio: fica na mesma linha dos controles, sempre à mão */
.som__b{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  padding:8px 11px;border:1px solid var(--dl-line-2);border-radius:10px;
  background:var(--dl-surface);color:var(--dl-text-muted);font:inherit;font-size:13px;
  font-weight:600;cursor:pointer}
.som__b b{font-weight:600}
.som__b .som__on{display:none}
.som__b[aria-pressed="true"]{border-color:var(--dl-marca-ink);color:var(--dl-text);
  background:rgba(var(--dl-marca-rgb),.16)}
.som__b[aria-pressed="true"] .som__on{display:block}
.som__b[aria-pressed="true"] .som__off{display:none}
.som__b[disabled]{opacity:.5;font-weight:400;cursor:default}
.som{display:flex;align-items:center;gap:8px;max-width:372px;margin:9px auto 0}
.som select{flex:1 1 auto;min-width:0;padding:8px 9px;border:1px solid var(--dl-line-2);border-radius:10px;
  background:var(--dl-surface);color:var(--dl-text-soft);font:inherit;font-size:12.5px}
.som select[hidden],.aviso[hidden]{display:none}
/* ---------- editor de falas ---------- */
.ed{max-width:372px;margin:10px auto 0;border:1px solid var(--dl-line-2);border-radius:12px;
  background:var(--dl-surface-2);padding:11px 11px 13px}
.ed[hidden]{display:none}
.ed__t{margin:0 0 4px;font-size:12px;color:var(--dl-text-muted);line-height:1.45}
.ed__i{margin:11px 0 0}
.ed__i label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dl-text-muted);margin-bottom:4px}
.ed__i label b{font-family:var(--dl-mono);text-transform:none;letter-spacing:0;color:var(--dl-marca-ink)}
.ed textarea{display:block;width:100%;min-height:74px;padding:8px 9px;resize:vertical;
  border:1px solid var(--dl-line-2);border-radius:9px;background:var(--dl-surface);
  color:var(--dl-text);font:inherit;font-size:12.5px;line-height:1.4}
.ed textarea:focus{outline:none;border-color:var(--dl-marca-ink);

<script>
(function () {
  'use strict';

  var raiz = document.documentElement;
  function $(id) { return document.getElementById(id); }
  var vp = $('vp'), ap = $('ap'), dedo = $('dedo'), leg = $('leg');

  /* O QUE ESTE ARQUIVO DEMONSTRA: 'ambos', 'saida' ou 'retorno'.
     É a única linha que muda entre as três versões do demo. */
  var SO = 'retorno';

  var VEL = 1, PAUSA = false, TOKEN = 0, ATO = 0, TOTAL = 1;

  /* ==================================================================
     FALAS — É AQUI QUE VOCÊ EDITA O TEXTO DE CADA TRECHO.

     Cada linha é uma cena. Troque o texto entre aspas à vontade.
     O que estiver entre <b> e </b> aparece em negrito na legenda
     (a voz ignora as marcações, ela lê só o texto).

     Regras para não quebrar nada:
       • não mude os nomes à esquerda (s01, s02, r01...);
       • mantenha as aspas simples no começo e no fim;
       • se o seu texto tiver um apóstrofo, escreva \' (barra + aspa).

     Este mesmo texto é o que vai para o narracao.json e vira o áudio
     gravado — então editar aqui é editar a voz também.
     ================================================================== */
  var FALAS = {

    /* ---------- SAÍDA ---------- */
    s01:   'Vamos aprender a preencher as informações do <b>controle de caixas</b>. Vamos começar pelos <b>lançamentos de saída</b>.',
    sData: 'Confirme a <b>data do movimento</b>. Ela já vem com o dia de hoje.',
    s02:   'Selecione o local de <b>saída</b>.',
    s03:   'Selecione o <b>destino</b>.',
    s04:   'Selecione o <b>motorista</b> responsável.',
    s05:   'Selecione o <b>veículo</b>.',
    s06:   'Vamos agora preencher as <b>quantidades</b>, um tipo de caixa de cada vez.',
    s07:   'Confira o <b>total</b> e grave o lançamento.',
    s08:   'Pronto. O lançamento entra em <b>Movimentos</b> na hora e o saldo já muda.',

    /* passagem automática da saída para o retorno */
    s09:   'Lançamento de saída concluído. Vamos seguir para os <b>lançamentos de retorno</b>.',

    /* ---------- RETORNO ---------- */
    /* r01 é falado quando alguém abre o retorno direto, pela aba */
    r01:   'Vamos agora fazer os <b>lançamentos de retorno</b>. Toque em <b>Lançar retorno</b>.',
    /* r01b é falado quando o retorno veio emendado no fim da saída */
    r01b:  'Estamos de volta ao início. Toque em <b>Lançar retorno</b>.',
    rData: 'Confirme a <b>data do movimento</b>. Ela já vem com o dia de hoje.',
    r02:   'Selecione a origem <b>de retorno da caixa</b>.',
    r03:   'Selecione o <b>destino de envio da caixa</b>.',
    r04:   'Selecione o <b>motorista responsável</b> pelo retorno.',
    r05:   'Selecione o <b>veículo</b> que trouxe as caixas.',
    r06:   'Vamos agora preencher as <b>quantidades</b> que voltaram, um tipo de caixa de cada vez.',
    r07:   'Confira o <b>total</b> e grave o lançamento.',
    r08:   'Pronto. O retorno entra em <b>Movimentos</b> na hora e o saldo já muda.',

    /* ---------- ENTRADA E ENCERRAMENTO ---------- */
    entrada: 'Vamos começar a nossa jornada de <b>Controle de Caixas</b>. Toque em <b>Assistir Tutorial</b> para ver como se faz.',
    fim:     'Pronto. Sempre que precisar, é só voltar aqui e assistir de novo. Toque em <b>Pular</b> para ir aos lançamentos.'
  };

  /* Rótulos dos botões da tela de entrada. Mude aqui; se mudar, lembre de
     ajustar as falas 'entrada' e 'fim', que citam esses nomes.
     O BOTÃO "LER" SAIU, a pedido: dentro do app a leitura tem lugar próprio — o
     Manual de Uso, no menu —, e um segundo caminho para o mesmo texto é um segundo
     lugar para consertar. Com ele fora, o cadeado do Pular passa a depender só do
     vídeo: mantê-lo dependendo de uma leitura que não existe mais trancaria a porta
     pelo lado de fora. */
  var BOTOES = {
    assistir: 'Assistir Tutorial',
    pular:    'Pular',
    sair:     'Sair'
  };


  /* ------------------------------------------------------------------
     dorme(ms): a única fonte de tempo da animação.
     Respeita pausa e velocidade, e é cancelada quando o TOKEN muda
     (reiniciar ou trocar de fluxo) — senão duas sequências rodariam
     em cima da mesma tela.
  ------------------------------------------------------------------ */
  function dorme(ms) {
    var meu = TOKEN;
    return new Promise(function (ok, falha) {
      var resta = ms;
      var t = setInterval(function () {
        if (meu !== TOKEN) { clearInterval(t); falha('cancelado'); return; }
        if (PAUSA) return;
        resta -= 34 * VEL;
        if (resta <= 0) { clearInterval(t); ok(); }
      }, 34);
    });
  }

  /* ---- o dedo ---- */
  /* getBoundingClientRect devolve px já com zoom aplicado; translate() dentro
     do mesmo contexto usa px sem zoom. Sem dividir pelo zoom, o dedo aterrissa
     no dobro da distância. Com zoom 1 o divisor é 1 e nada muda. */
  function zoom() {
    var r = vp.getBoundingClientRect();
    return vp.offsetWidth ? r.width / vp.offsetWidth : 1;
  }
  function pos(el) {
    var a = el.getBoundingClientRect(), b = vp.getBoundingClientRect(), z = zoom() || 1;
    return { x: (a.left - b.left + a.width / 2) / z, y: (a.top - b.top + a.height / 2) / z };
  }
  async function mover(el, ms) {
    ms = ms || 420;
    var p = pos(el);
    dedo.style.transitionDuration = (ms / VEL) + 'ms, .22s';
    dedo.classList.add('dedo--on');
    dedo.style.setProperty('--x', p.x + 'px');
    dedo.style.setProperty('--y', p.y + 'px');
    await dorme(ms);
  }
  async function tocar(el) {
    dedo.style.setProperty('--s', '.82');
    dedo.classList.add('dedo--toca');
    if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    await dorme(170);
    dedo.style.setProperty('--s', '1');
    await dorme(150);
    dedo.classList.remove('dedo--toca');
  }
  async function bater(el, msMover) { await mover(el, msMover); await tocar(el); }
  function sumir() { dedo.classList.remove('dedo--on'); }

  /* ------------------------------------------------------------------
     NARRAÇÃO
     Usa a voz do próprio aparelho (Web Speech API). Não baixa nada e não
     depende de servidor. Começa desligada porque o navegador só deixa
     falar depois de um toque do usuário.
  ------------------------------------------------------------------ */
  var VOZES = [], VOZ = null, SOM = false;
  var temVoz = ('speechSynthesis' in window);
  var CHAVE_SOM = 'caixas.demo.som';

  /* localStorage falha em janela anônima, com cookies bloqueados e dentro de
     iframe. Nunca pode derrubar a tela por causa de uma preferência. */
  function lembrar(v) {
    try { localStorage.setItem(CHAVE_SOM, v ? '1' : '0'); } catch (e) {}
  }
  function lembrado() {
    try { return localStorage.getItem(CHAVE_SOM) === '1'; } catch (e) { return false; }
  }

  var FEMININA = /luciana|francisca|thalita|maria|camila|fernanda|joana|leticia|vitoria|yara|brenda|elza|giovanna|female|feminin|mulher/i;
  /* As vozes "Desktop"/SAPI do Windows e a espeak do Linux são da geração
     difone — é delas que vem o som metálico. As Natural/Neural/Online da
     Microsoft e as do Google são neurais e soam como gente. */
  var BOA = /natural|neural|online|google|siri|premium|enhanced|eloquence/i;
  var RUIM = /desktop|sapi|espeak|compact|festival|pico/i;

  function pontos(v) {
    var n = v.name || '', s = 0;
    if (/pt[-_]?BR/i.test(v.lang)) s += 100;
    if (BOA.test(n)) s += 45;
    if (v.localService === false) s += 15;   /* voz de servidor: quase sempre neural */
    if (FEMININA.test(n)) s += 60;   /* pedido: voz feminina vem antes de tudo */
    if (RUIM.test(n)) s -= 40;
    return s;
  }
  function ehRobotica(v) {
    return !!v && RUIM.test(v.name || '') && !BOA.test(v.name || '');
  }

  function carregarVozes() {
    if (!temVoz) return;
    var todas = speechSynthesis.getVoices() || [];
    VOZES = todas.filter(function (v) { return /^pt/i.test(v.lang); })
      .sort(function (a, b) { return pontos(b) - pontos(a); });
    VOZ = VOZES[0] || null;
    var sel = $('vozes');
    sel.innerHTML = VOZES.map(function (v, k) {
      return '<option value="' + k + '">' + v.name + ' (' + v.lang + ')</option>';
    }).join('');
    pintarSom();
  }

  /* estado visível do botão e do que depende dele */
  function pintarSom() {
    var b = $('som');
    var possivel = temVoz && VOZES.length > 0;
    b.disabled = !possivel;
    b.setAttribute('aria-pressed', String(SOM && possivel));
    b.setAttribute('aria-label', SOM ? 'Desligar a narração' : 'Ligar a narração');
    b.title = possivel
      ? (SOM ? 'Desligar a narração' : 'Ligar a narração')
      : 'Este aparelho não tem voz em português';
    $('som-t').textContent = SOM && possivel ? 'Áudio ligado' : 'Áudio';
    $('vozes').hidden = !(SOM && possivel && VOZES.length > 1);
    var av = $('som-aviso');
    if (!temVoz) {
      av.hidden = false;
      av.textContent = 'Este navegador não tem síntese de voz. As legendas continuam valendo.';
    } else if (!VOZES.length) {
      av.hidden = false;
      av.textContent = 'Nenhuma voz em português instalada neste aparelho. '
        + 'No Windows: Configurações › Hora e idioma › Voz › Adicionar vozes.';
    } else if (SOM && ehRobotica(VOZ)) {
      /* a voz metálica não é defeito da tela: é a voz antiga do sistema */
      av.hidden = false;
      av.textContent = 'A voz "' + VOZ.name + '" é da geração antiga do Windows e soa metálica. '
        + 'Para uma voz natural: Configurações › Hora e idioma › Voz › Adicionar vozes › '
        + 'Português (Brasil), ou abra esta página no Microsoft Edge, que traz as vozes '
        + 'Natural da Francisca e da Thalita.';
    } else {
      av.hidden = true;
    }
  }
  function semTags(h) {
    var d = document.createElement('div');
    d.innerHTML = h;
    return d.textContent;
  }
  /* ------------------------------------------------------------------
     Três defeitos conhecidos do speechSynthesis, todos tratados aqui:

     1. No Chrome, cancel() seguido de speak() no mesmo tique trava a fila —
        a voz simplesmente para de falar até recarregar a página. Por isso o
        speak sai num setTimeout depois do cancel.
     2. Ainda no Chrome, fala com mais de ~15 segundos é cortada no meio.
        Um pause()+resume() a cada 9s mantém a fila viva.
     3. Frase longa demais numa única utterance aumenta as duas chances
        acima, então o texto é quebrado por pontuação.
  ------------------------------------------------------------------ */
  var FALA = 0, PULSO = null;

  function pararPulso() {
    if (PULSO) { clearInterval(PULSO); PULSO = null; }
  }
  function pedacos(t) {
    var partes = t.match(/[^.!?…]+[.!?…]*\s*/g) || [t];
    var fora = [], atual = '';
    partes.forEach(function (p) {
      if ((atual + p).length > 150 && atual) { fora.push(atual.trim()); atual = p; }
      else { atual += p; }
    });
    if (atual.trim()) fora.push(atual.trim());
    return fora;
  }
  function narrar(txt, aoFim) {
    var pronto = false;
    function acabou() { if (!pronto) { pronto = true; if (aoFim) aoFim(); } }
    if (!SOM || !temVoz) { acabou(); return; }
    var meu = ++FALA;
    var texto = semTags(txt);
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(function () {
      if (meu !== FALA || !SOM) { acabou(); return; }
      try {
        var ps = pedacos(texto);
        ps.forEach(function (p, i) {
          var u = new SpeechSynthesisUtterance(p);
          u.lang = (VOZ && VOZ.lang) || 'pt-BR';
          /* num try próprio: uma voz recusada não pode impedir a fala inteira —
             sem a voz escolhida o navegador usa a padrão do idioma. */
          try { if (VOZ) u.voice = VOZ; } catch (e2) {}
          /* 0,95 e tom neutro: acima disso a voz sintética fica estridente */
          u.rate = Math.max(.5, Math.min(2, .95 * VEL));
          u.pitch = 1;
          u.volume = 1;
          if (i === ps.length - 1) {
            /* onerror conta como fim: sem isso, uma voz que falha deixa a
               animação parada esperando para sempre. */
            u.onend = acabou;
            u.onerror = acabou;
          }
          speechSynthesis.speak(u);
        });
      } catch (e) { acabou(); }
    }, 140);
  }
  /* Um único pulso, vivo enquanto o som estiver ligado. Reiniciá-lo a cada
     fala não adiantaria nada: as cenas trocam mais rápido que os 9s. */
  function ligarPulso() {
    pararPulso();
    PULSO = setInterval(function () {
      if (!SOM || PAUSA) return;                 /* não ressuscita fala pausada */
      if (!speechSynthesis.speaking) return;
      try { speechSynthesis.pause(); speechSynthesis.resume(); } catch (e) {}
    }, 9000);
  }
  function calar() {
    FALA++;
    pararPulso();
    if (temVoz) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* ---- legenda ---- */
  function mostrar(txt, erro) {
    leg.innerHTML = txt;
    leg.classList.toggle('leg--erro', !!erro);
  }
  function fala(txt, erro) {
    mostrar(txt, erro);
    narrar(txt);
  }

  /* ------------------------------------------------------------------
     dizer(): mostra a legenda, narra, e só devolve o controle quando a
     voz TERMINA de falar — mais um respiro. Com o áudio desligado cai no
     tempo fixo de sempre, que é o comportamento antigo.

     A corrida com dorme(teto) é rede de segurança: se o onend não chegar
     (voz que falha sem erro, aba em segundo plano, bug do navegador), a
     animação segue em vez de travar para sempre.
  ------------------------------------------------------------------ */
  var RESPIRO = 420;
  function dizer(txt, ms, erro) {
    mostrar(txt, erro);
    if (!SOM || !temVoz) { narrar(txt); return dorme(ms); }
    var meu = TOKEN;
    var fim = new Promise(function (ok) { narrar(txt, ok); });
    var teto = Math.max(ms, semTags(txt).length * 150 + 4000);
    return Promise.race([fim, dorme(teto)]).then(function () {
      if (meu !== TOKEN) throw 'cancelado';
      return dorme(RESPIRO);
    });
  }

  /* ---- números ---- */
  function num(n) { return n.toLocaleString('pt-BR'); }

  /* ------------------------------------------------------------------

  function tecladoNum() {
    var h = '<div class="tec tec--num" id="tec"><div class="tec__g">';
    NUMS.forEach(function (k) {
      h += '<button class="tec__k" type="button" id="k-' + (k === '⌫' ? 'del' : k === 'OK' ? 'ok' : k) + '">' + k + '</button>';
    });
    return h + '</div></div>';
  }
  var LINHAS_TXT = [
    '1234567890'.split(''),
    'qwertyuiop'.split(''),
    'asdfghjkl'.split(''),
    ['z','x','c','v','b','n','m',',','⌫']
  ];
  function tecladoTxt() {
    var h = '<div class="tec tec--txt" id="tec">';
    LINHAS_TXT.forEach(function (ln) {
      h += '<div class="tec__l">';
      ln.forEach(function (k) {
        h += '<button class="tec__k" type="button" data-k="' + k + '">' + k + '</button>';
      });
      h += '</div>';
    });
    h += '<div class="tec__l"><button class="tec__k tec__k--w" type="button" data-k=" ">espaço</button>'
      + '<button class="tec__k" type="button" data-k="ok">ok</button></div>';

  async function fechaTeclado() {
    var t = $('tec');

    sobe(0);
    await dorme(390);

  /* digita um número tocando as teclas de verdade */
  async function digitar(idCampo, valor, aoMudar) {
    var campo = $(idCampo);
    campo.classList.add('ap__cx--foco');
    campo.innerHTML = '<i></i>';
    var s = '';
    var d = String(valor).split('');
    for (var j = 0; j < d.length; j++) {
      await bater($('k-' + d[j]), 300);
      s += d[j];
      campo.innerHTML = s + '<i></i>';
      if (aoMudar) aoMudar(parseInt(s, 10));
      await dorme(90);
    }
    campo.innerHTML = s;
    campo.classList.remove('ap__cx--foco');
  }

  /* digita texto tocando as letras */
  async function digitarTexto(idAlvo, texto) {
    var alvo = $(idAlvo), s = '';
    for (var j = 0; j < texto.length; j++) {
      var c = texto[j];
      var k = document.querySelector('[data-k="' + (c === ' ' ? ' ' : c) + '"]');
      if (k) { await mover(k, 150); await tocar(k); }
      else { await dorme(90); }
      s += c;
      alvo.innerHTML = s + '<i></i>';
    }
    alvo.innerHTML = s;
  }

    } catch (e) {
      var d = new Date();
      return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();

  /* preenche a contagem e devolve o total */
  async function contar(valores) {
    var somas = {};
    function total() {
      var s = 0;
      for (var k in somas) s += somas[k];
      $('tot-n').textContent = num(s);
      return s;
    }
    vp.insertAdjacentHTML('beforeend', tecladoNum());
    await bater($('cx-p'), 440);
    await abreTeclado(490);
    for (var j = 0; j < TIPOS.length; j++) {
      var t = TIPOS[j];
      if (j > 0) await bater($('cx-' + t.id), 340);
      /* jshint loopfunc:true */
      await digitar('cx-' + t.id, valores[t.id], (function (id) {
        return function (v) { somas[id] = v; total(); };
      })(t.id));
      await dorme(150);
    }
    $('grv').disabled = false;
    await bater($('k-ok'), 340);
    await fechaTeclado();
    var el = $('tec'); if (el) el.parentNode.removeChild(el);
    return total();
  }

  function folha(titulo, opcoes) {

    });

  async function abreFolha(titulo, opcoes) {

  async function fechaFolha() {

  async function toast(titulo, sub) {

      '<div class="toast" id="toast"><i>✓</i><span><b>' + titulo + '</b><em>' + sub + '</em></span></div>');

  /* ------------------------------------------------------------------
     MOTOR
  ------------------------------------------------------------------ */
  var EMENDOU = false;

  function roteiro() { return raiz.dataset.fluxo === 'retorno' ? RETORNO : SAIDA; }

  function progresso() {
    $('ctrl-i').style.width = (ATO / TOTAL * 100) + '%';
  }

  async function rodar() {
    var meu = ++TOKEN;
    calar();
    /* teclado, folha e toast são irmãos da tela do app dentro do visor —
       trocar o innerHTML da tela não os remove. Sem esta limpeza, o toast
       "Saída gravada" fica pendurado por cima do fluxo de retorno. */
    [].forEach.call(vp.querySelectorAll('.tec,.dl-folha,.toast'), function (el) {
      el.parentNode.removeChild(el);
    });
    var L = roteiro();
    TOTAL = L.length; ATO = 0; progresso();
    dedo.classList.remove('dedo--on');
    dedo.style.setProperty('--x', '186px');
    dedo.style.setProperty('--y', '520px');
    try {
      for (var j = 0; j < L.length; j++) {
        if (meu !== TOKEN) return;
        await L[j].f();
        ATO = j + 1; progresso();
      }
      sumir();
      /* Na versão completa a saída emenda no retorno, que é a outra metade da
         mesma operação. Nas versões separadas, cada uma termina em si. */
      if (SO === 'ambos' && raiz.dataset.fluxo !== 'retorno') {
        await dizer(FALAS.s09, 2400);
        document.dispatchEvent(new CustomEvent('demo:fim', { detail: 'saida' }));
        EMENDOU = true;
        trocar('retorno');
        return;
      }
      await tiraToast();
      VIU.video = true;                          /* assistiu até o fim */
      guardarViu();
      TELA = 'entrada';
      painel(false);
      telaEntrada(SUB_FIM);
      await dizer(FALAS.fim, 2800);
      window.__demoFim = true;
      document.dispatchEvent(new CustomEvent('demo:fim', { detail: raiz.dataset.fluxo }));
    } catch (e) {
      /* cancelado por reiniciar ou troca de fluxo: normal, não é erro */
    }
  }

  function trocar(fl) {
    raiz.setAttribute('data-fluxo', fl);
    window.__demoFim = false;
    rodar();
  }

  /* clique real do usuário no botão de encerramento */
  /* Cliques reais na tela de entrada. Cada um avisa o app por um evento;
     é lá que a navegação de verdade acontece. */
  ap.addEventListener('click', function (e) {
    if (e.target.closest('#t-sair')) {
      /* cancelable: o app pode fechar o tutorial do seu jeito */
      var sai = document.dispatchEvent(new CustomEvent('demo:sair', { cancelable: true }));
      if (sai) irEntrada(SUB_ENTRADA, FALAS.entrada);
      else { TOKEN++; calar(); }
      return;
    }
    var b = e.target.closest('#t-assistir,#t-pular');
    if (!b) return;
    if (b.id === 't-assistir') {
      document.dispatchEvent(new CustomEvent('demo:assistir'));
      TELA = 'tutorial';
      painel(true);                              /* controles só aqui dentro */
      EMENDOU = false;
      trocar(SO === 'retorno' ? 'retorno' : 'saida');
      return;
    }
    /* trancado: não dá para pular sem ter assistido */
    if (!liberado()) {
      mostrar('Ainda falta <b>assistir ao tutorial</b>.');
      return;
    }
    document.dispatchEvent(new CustomEvent('demo:pular'));
    calar();
    TOKEN++;
    painel(false);
    telaInicial();
    mostrar('<b>Pular</b> leva direto para os lançamentos.');
  });

  var abas = document.querySelector('.fluxos');
  if (abas) {
    abas.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-fl]');
      if (b) trocar(b.dataset.fl);
    });
  }
  $('reiniciar').addEventListener('click', function () {
    window.__demoFim = false;
    rodar();
  });
  $('tocar').addEventListener('click', function () {
    PAUSA = !PAUSA;
    this.textContent = PAUSA ? 'Continuar' : 'Pausar';
    if (temVoz) { try { PAUSA ? speechSynthesis.pause() : speechSynthesis.resume(); } catch (e) {} }
  });

  function ligarSom(v) {
    SOM = !!v;
    lembrar(SOM);
    pintarSom();
    if (SOM) {
      ligarPulso();
      /* Recomeça do início: com o som ligado cada cena passa a esperar a voz
         terminar. Continuar do meio deixaria a cena atual no relógio antigo e
         a primeira fala sairia cortada — que é exatamente o defeito a evitar. */
      if (TELA === 'tutorial') rodar(); else narrar(leg.innerHTML);
    } else {
      calar();
    }
  }
  $('som').addEventListener('click', function () { ligarSom(!SOM); });

  $('vozes').addEventListener('change', function () {
    VOZ = VOZES[parseInt(this.value, 10)] || VOZ;
    if (SOM) narrar(leg.innerHTML);
  });

  if (temVoz) {
    carregarVozes();
    speechSynthesis.addEventListener('voiceschanged', carregarVozes);
    /* A lista de vozes costuma chegar depois do load em alguns navegadores. */
    setTimeout(carregarVozes, 900);
    if (lembrado()) {
      SOM = true;
      pintarSom();
      ligarPulso();
      /* iOS e Safari só deixam falar depois de um toque. Se o áudio estava
         ligado da visita anterior, espera o primeiro toque para voltar a falar
         em vez de ficar mudo sem explicação. */
      var destrava = function () {
        document.removeEventListener('pointerdown', destrava);
        if (SOM) narrar(leg.innerHTML);
      };
      document.addEventListener('pointerdown', destrava);
    }
  }
  pintarSom();
  $('vels').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    VEL = parseFloat(b.dataset.v);
    [].forEach.call(this.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });


  /* ==================================================================
     EDITOR DE FALAS
     Mesmo bloco FALAS acima, editável pela tela. O que for digitado aqui
     entra na hora, é guardado neste aparelho e sai no HTML baixado.
     ================================================================== */
  var FALAS_ORIG = JSON.parse(JSON.stringify(FALAS));
  var CHAVE_FALAS = 'caixas.demo.falas.' + SO;
  var ROTULOS = [
    ['s01', 'Abertura da saída'],
    ['sData', 'Data do movimento (saída)'],
    ['s02', 'Campo saída'],
    ['s03', 'Campo destino (saída)'],
    ['s04', 'Campo motorista (saída)'],
    ['s05', 'Campo veículo (saída)'],
    ['s06', 'Quantas caixas (saída)'],
    ['s07', 'Conferir o total e gravar'],
    ['s08', 'Saída gravada'],
    ['s09', 'Passagem para o retorno'],
    ['r01', 'Abertura do retorno (aberto pela aba)'],
    ['r01b', 'Abertura do retorno (emendado na saída)'],
    ['rData', 'Data do movimento (retorno)'],
    ['r02', 'Campo retorno'],
    ['r03', 'Campo destino (retorno)'],
    ['r04', 'Campo motorista (retorno)'],
    ['r05', 'Campo veículo (retorno)'],
    ['r06', 'Quantas caixas (retorno)'],
    ['r07', 'Conferir o total e gravar'],
    ['r08', 'Retorno gravado'],
    ['entrada', 'Tela de entrada do app'],
    ['fim', 'Encerramento']
  ];

  /* Guarda SÓ o que foi alterado, junto com o texto de fábrica em que a
     alteração se baseou. Sem isso, uma versão nova do arquivo chegava com
     textos novos e o navegador os sobrescrevia em silêncio com a cópia
     antiga — o campo mostrava uma coisa e a correção nunca aparecia. */
  function guardarFalas() {
    var pac = { base: {}, meu: {} };
    ROTULOS.forEach(function (r) {
      var k = r[0];
      if (FALAS[k] !== FALAS_ORIG[k]) { pac.base[k] = FALAS_ORIG[k]; pac.meu[k] = FALAS[k]; }
    });
    try { localStorage.setItem(CHAVE_FALAS, JSON.stringify(pac)); } catch (e) {}
  }
  var SUBSTITUIDAS = [];
  function lerFalas() {
    SUBSTITUIDAS = [];
    var g;
    try { g = JSON.parse(localStorage.getItem(CHAVE_FALAS) || 'null'); } catch (e) { return; }
    if (!g || !g.meu || !g.base) {
      /* formato antigo: descarta, era ele que causava o problema */
      try { localStorage.removeItem(CHAVE_FALAS); } catch (e2) {}
      return;
    }
    ROTULOS.forEach(function (r) {
      var k = r[0];
      if (typeof g.meu[k] !== 'string') return;
      if (g.base[k] === FALAS_ORIG[k]) FALAS[k] = g.meu[k];   /* texto de fábrica não mudou: sua edição vale */
      else SUBSTITUIDAS.push(r[1]);                            /* mudou: a versão nova ganha */
    });
    if (SUBSTITUIDAS.length) guardarFalas();
  }

  function montarEditor() {
    var grupo = '';
    $('ed-campos').innerHTML = ROTULOS.map(function (r) {
      var g = r[0].charAt(0) === 's' ? 'SAÍDA' : 'RETORNO';
      var cab = '';
      if (g !== grupo) { grupo = g; cab = '<p class="ed__g">' + g + '</p>'; }
      return cab + '<div class="ed__i"><label for="f-' + r[0] + '">' + r[1] +
             ' &nbsp;<b>' + r[0] + '</b></label>' +
             '<textarea id="f-' + r[0] + '" data-k="' + r[0] + '" rows="3"></textarea>' +
             '<button type="button" class="ed__ouvir" data-ouvir="' + r[0] + '">Ouvir</button>' +
             '</div>';
    }).join('');
    ROTULOS.forEach(function (r) { $('f-' + r[0]).value = FALAS[r[0]]; });
  }
  function aviso(txt) {
    $('ed-ok').textContent = txt;
    clearTimeout(aviso.t);
    aviso.t = setTimeout(function () { $('ed-ok').textContent = ''; }, 4000);
  }

  $('abrir-ed').addEventListener('click', function () {
    var ed = $('ed');
    ed.hidden = !ed.hidden;
    this.setAttribute('aria-expanded', String(!ed.hidden));
    this.textContent = ed.hidden ? 'Editar as falas' : 'Fechar o editor';
  });
  $('ed-campos').addEventListener('input', function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.k) return;
    FALAS[t.dataset.k] = t.value;
    guardarFalas();
    aviso('Texto guardado. Use o botão Ouvir para conferir a voz.');
  });
  /* ouvir uma fala isolada: esperar a cena chegar para saber se o texto
     mudou é o que faz parecer que a edição não pegou */
  $('ed-campos').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ouvir]');
    if (!b) return;
    var k = b.dataset.ouvir;
    if (!SOM) { aviso('Ligue o Áudio primeiro.'); return; }
    calar();
    narrar(FALAS[k]);
    aviso('Falando: ' + k);
  });
  $('ed-reset').addEventListener('click', function () {
    ROTULOS.forEach(function (r) { FALAS[r[0]] = FALAS_ORIG[r[0]]; });
    guardarFalas();
    montarEditor();
    aviso('Textos originais restaurados.');
  });

  /* monta uma cópia do próprio arquivo com o bloco FALAS trocado */
  function blocoFalas() {
    var linhas = ROTULOS.map(function (r, i) {
      var v = String(FALAS[r[0]]).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      return "    " + r[0] + ": '" + v + "'" + (i === ROTULOS.length - 1 ? '' : ',');
    });
    return '  var FALAS = {\n' + linhas.join('\n') + '\n  };';
  }
  $('ed-baixar').addEventListener('click', function () {
    try {
      var src = '<!doctype html>\n' + document.documentElement.outerHTML;
      var re = /[ ]{2}var FALAS = \{[\s\S]*?\n[ ]{2}\};/;
      if (!re.test(src)) { aviso('Não achei o bloco FALAS no arquivo.'); return; }
      src = src.replace(re, blocoFalas());
      var url = URL.createObjectURL(new Blob([src], { type: 'text/html;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url; a.download = 'demo-lancamento.html';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      aviso('Arquivo baixado com as suas falas.');
    } catch (e) {
      aviso('O navegador bloqueou o download. Copie os textos à mão.');
    }
  });

  lerFalas();
  montarEditor();
  if (SUBSTITUIDAS.length) {
    $('ed').hidden = false;
    $('abrir-ed').setAttribute('aria-expanded', 'true');
    $('abrir-ed').textContent = 'Fechar o editor';
    aviso('Esta versão trouxe texto novo para: ' + SUBSTITUIDAS.join(', ') +
          '. As suas edições anteriores nesses trechos foram descartadas.');
  }

  /* ganchos para gravação automática */
  window.__demo = { trocar: trocar, rodar: rodar };
  window.__demoFim = false;

  if (SO === 'retorno' || location.hash === '#retorno') raiz.setAttribute('data-fluxo', 'retorno');
  if (location.search.indexOf('gravar=1') > -1) raiz.setAttribute('data-gravar', '1');

  lerViu();
  /* O tutorial NÃO começa sozinho: ele espera o toque em Assistir. */
  painel(false);
  telaEntrada(SUB_ENTRADA);
  mostrar(FALAS.entrada);
  /* ?auto=1 dispara o tutorial sem toque — usado só para gravar o vídeo */
  if (location.search.indexOf('auto=1') > -1) {
    TELA = 'tutorial';
    painel(true);
    trocar(SO === 'retorno' ? 'retorno' : 'saida');
  }
})();
</script>

<script>
/* ================= A VOLTA PARA O APP =================
 *
 * O demo nao navega sozinho: ele AVISA, por eventos, e quem decide para onde ir e o
 * app. Foi assim que ele chegou escrito, e e o que permite que este arquivo continue
 * abrindo direto no navegador sem quebrar nada.
 *
 * AS TRES SAIDAS MARCAM. Assistir ate o fim, ler o manual ou pular sao escolhas
 * diferentes sobre a MESMA pergunta — "voce ja foi apresentado?" —, e a resposta das
 * tres e sim. Marcar so o fim do video faria quem le o manual voltar a cair aqui no
 * proximo acesso, e a terceira vez isso deixa de parecer ajuda.
 *
 * A MARCA LOCAL VAI NA HORA; a do servidor, sem esperar. Esperar a rede seria segurar
 * a pessoa numa tela que ela acabou de pedir para deixar — e o pior caso da espera sao
 * trinta segundos. Gravada a sessao, este navegador ja nao volta para ca; se o pedido
 * se perder, o proximo acesso de OUTRO aparelho mostra o tutorial de novo, que e o
 * lado errado menos caro. */
(function () {
  'use strict';
  var Q = window.QDC;

  /* EMBUTIDO NO PAINEL, ele nao navega. As saidas dele mandam para o app de campo; dentro
     do quadro do painel isso carregaria o app de campo DENTRO da pagina do escritorio,
     que e o oposto do que o botao promete. Aqui ele so marca e deixa o demo fazer o que
     ja faz sozinho: voltar para a propria tela de entrada. */
  var embutido = (function () {
    try { return window.top !== window.self; } catch (e) { return true; }
  })();

  function marcar() {
    try {
      var s = Q && Q.sessao();
      if (!s || !s.id) return;
      s.viuTutorial = true;
      Q.entrar(s);
      Q.post({ acao: 'viuTutorial', usuarioId: s.id }).catch(function () {});
    } catch (e) {}
  }
  function voltar() { location.href = 'index.html'; }

  /* `preventDefault` no que e cancelavel: sem ele o demo redesenha a propria tela de
     entrada no instante anterior a navegacao, e a pessoa ve um pisca sem sentido. */
  document.addEventListener('demo:sair', function (e) {
    marcar();
    if (embutido) return;          /* o demo redesenha a tela de entrada sozinho */
    e.preventDefault();
    voltar();
  });
  document.addEventListener('demo:pular', function () {
    marcar();
    if (!embutido) voltar();
  });
  /* `demo:fim` dispara duas vezes — uma ao fim da saida, que EMENDA no retorno, e uma
     ao fim do retorno, que e o fim de verdade. So a segunda encerra. */
  document.addEventListener('demo:fim', function (e) {
    if (e.detail === 'retorno') marcar();
  });
})();
</script>
