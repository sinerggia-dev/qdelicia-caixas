<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<title>Extrato de Caixas · Qdelícia Frutas</title>
<link rel="stylesheet" href="styles.css?v=ebb255dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A fonte do modelo. Carrega DEPOIS do styles.css e nao bloqueia nada: o app roda no
     galpao, as vezes sem rede, e o `system-ui` do `--fonte` segura a tela sozinho se ela
     nao chegar. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- ================= A APARÊNCIA, ANTES DE PINTAR =================
     Este script é o ÚNICO que precisa estar no <head>. O `app.js` carrega no fim da
     página: esperar por ele faria a tela nascer na cor de fábrica e piscar para a
     escolhida um instante depois — e quem abre o painel trinta vezes por dia vê esse
     pisca trinta vezes.

     O QUE ELE LÊ É UMA CÓPIA, não a verdade. A aparência é da EMPRESA e mora na
     configuração, no servidor; esta cópia local existe só para a tela nascer certa antes
     de a rede responder. Quando os dados chegam, o `app.js` aplica o que veio de lá e
     atualiza a cópia — se alguém trocou no escritório, a máquina do galpão acompanha na
     primeira carga.

     O `try` não é zelo exagerado: `localStorage` estoura em janela anônima, com cookies
     bloqueados e dentro de iframe. Sem ele, a tela inteira morre aqui, no <head>, antes
     de existir qualquer coisa para mostrar o erro.

     E OS NOMES SÃO CONFERIDOS. Um valor que o CSS não conhece não pinta nada: a página
     ficaria sem cor de marca nenhuma, e a causa estaria num armazenamento que ninguém
     pensa em abrir. -->
<script>
(function(){
  var r = document.documentElement, t, f;
  try {
    t = localStorage.getItem('qdc_tema');
    f = localStorage.getItem('qdc_fundo');
  } catch (e) { t = f = null; }
  r.setAttribute('data-tema',  ['verde','rosa','roxo'].indexOf(t) < 0 ? 'roxo' : t);
  r.setAttribute('data-fundo', ['azul','cinza','preto'].indexOf(f) < 0 ? 'azul' : f);
})();
</script>
</head>
<body>

<!-- Sem barra lateral: esta pagina e o link que o cliente abre, so leitura, e nao ha
     para onde navegar. O que ela pega do modelo e o cabecalho de pagina e as cores — as
     mesmas do painel, para quem recebe o link reconhecer de onde ele veio. -->
<main class="main">
  <div class="cab-pagina">
    <div class="cab-pagina__id">
      <div class="cab-pagina__acima" id="cabNome">Qdelícia Frutas</div>
      <h1 class="cab-pagina__titulo">Extrato de Caixas</h1>
    </div>
  </div>

  <div class="corpo-pagina">
    <div id="conteudo"><div class="card"><div class="vazio">Carregando extrato…</div></div></div>
    <p style="font-size:12px;color:var(--txt3);text-align:center;margin:22px 0">
      Qdelícia Frutas · Controle de Caixas — documento gerado automaticamente.
    </p>
  </div>
</main>

<div id="toast"></div>

<script src="config.js"></script>
<script src="app.js?v=0f2eabe8"></script>
<script>
(function(){
  'use strict';
  var Q = window.QDC;
  var token = new URLSearchParams(location.search).get('t') || '';
  var box = document.getElementById('conteudo');

  if (!token){
    box.innerHTML = '<div class="card"><div class="aviso-box erro">Link inválido — falta o código de acesso.</div></div>';
    return;
  }

  Q.get({acao:'extratoToken', t:token}).then(function(r){
    if (!r.ok) throw new Error(r.erro);
    document.getElementById('cabNome').textContent = r.local.nome;
    var ag = r.aging || {};
    var linhas = r.linhas.slice().reverse();

    box.innerHTML =
      '<div class="kpis">'+
        '<div class="kpi '+(r.saldo>0?'aviso':'ok')+'"><div class="v">'+Q.num(r.saldo)+'</div><div class="r">caixas em seu poder hoje</div></div>'+
        (ag.d31?'<div class="kpi alerta"><div class="v">'+Q.num(ag.d31)+'</div><div class="r">parada há mais de 30 dias</div></div>':'')+
        (r.emConferencia?'<div class="kpi info"><div class="v">'+Q.num(r.emConferencia)+'</div><div class="r">contadas, em conferência no galpão</div></div>':'')+
        (ag.maisAntiga!==null&&ag.maisAntiga!==undefined?'<div class="kpi"><div class="v">'+ag.maisAntiga+'<span style="font-size:15px"> dias</span></div><div class="r">idade da caixa mais antiga</div></div>':'')+
      '</div>'+
      '<div class="card"><h2>Idade das caixas<span class="sub">Quanto mais antiga, maior o risco de a caixa não voltar.</span></h2>'+
        Q.barraAging(ag)+
        (r.porTipo && r.porTipo.length>1 ? '<h3>Por tipo de caixa</h3><div class="tabela-wrap"><table><thead><tr><th>Tipo</th><th class="num">Quantidade</th></tr></thead><tbody>'+
          r.porTipo.map(function(t){ return '<tr><td>'+Q.esc(t.tipo)+'</td><td class="num"><b>'+Q.num(t.qtd)+'</b></td></tr>'; }).join('')+
          '</tbody></table></div>' : '')+
      '</div>'+
      '<div class="card"><h2>Movimentação<span class="sub">Tudo que saiu para você e tudo que voltou para nós.</span></h2>'+
        '<div class="tabela-wrap"><table><thead><tr><th>Data</th><th>Movimento</th><th>Caixa</th>'+
        '<th class="num">Recebidas</th><th class="num">Devolvidas</th><th class="num">Saldo</th></tr></thead><tbody>'+
        (linhas.length ? linhas.map(function(x){
          return '<tr class="'+(x.status==='AGUARDANDO'?'destaque':'')+'"><td>'+Q.dataBR(x.data)+'</td>'+
            '<td>'+Q.esc(x.descricao)+(x.status==='AGUARDANDO'?' <span class="tag amarela">em conferência</span>':'')+'</td>'+
            '<td>'+Q.esc(x.tipoCaixa)+'</td>'+
            '<td class="num">'+(x.entrada?Q.num(x.entrada):'')+'</td>'+
            '<td class="num">'+(x.saida?Q.num(x.saida):'')+'</td>'+
            '<td class="num"><b>'+Q.num(x.saldo)+'</b></td></tr>';
        }).join('') : '<tr><td colspan="6" class="vazio">Sem movimentos registrados.</td></tr>')+
        '</tbody></table></div>'+
        '<div class="linha-btn"><button class="btn sec" onclick="window.print()" style="flex:0;min-width:150px">🖨 Imprimir</button></div>'+
      '</div>'+
      (r.saldo>0 ? '<div class="aviso-box atencao">Pedimos a gentileza de separar as caixas vazias para a próxima coleta. Qualquer divergência, fale com nosso escritório.</div>' : '');
  }).catch(function(e){
    box.innerHTML = '<div class="card"><div class="aviso-box erro">'+Q.esc(e.message)+'</div></div>';
  });
})();
</script>
</body>
</html>
